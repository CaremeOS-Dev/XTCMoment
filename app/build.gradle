plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


// 原厂 APK 内所有 support 库均为 25.4.0，这里强制统一版本，避免混入其它版本导致重复类。
configurations.all {
    resolutionStrategy {
        force 'com.android.support:support-annotations:25.4.0'
        force 'com.android.support:support-compat:25.4.0'
        force 'com.android.support:support-core-ui:25.4.0'
        force 'com.android.support:support-core-utils:25.4.0'
        force 'com.android.support:support-fragment:25.4.0'
        force 'com.android.support:support-media-compat:25.4.0'
        force 'com.android.support:support-vector-drawable:25.4.0'
        force 'com.android.support:animated-vector-drawable:25.4.0'
        force 'com.android.support:appcompat-v7:25.4.0'
        force 'com.android.support:design:25.4.0'
        force 'com.android.support:recyclerview-v7:25.4.0'
        force 'com.android.support:transition:25.4.0'
        force 'com.android.support:support-v4:25.4.0'
        force 'com.android.support:exifinterface:25.4.0'

        force 'com.squareup.okhttp3:okhttp:3.12.0'
        force 'com.squareup.okhttp3:logging-interceptor:3.12.0'
        force 'com.squareup.okio:okio:1.15.0'
    }
}
android {
    namespace 'com.xtc.moment'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xtc.moment'
        minSdk 19
        targetSdk 25
        versionCode 53110
        versionName '5.3.11.Develop_Qcom_AW_Moment_J359_G17c225e_D2e85c07f'
        multiDexEnabled true
        ndk { abiFilters 'armeabi' }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/prebuilt']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        incremental true
    }
    kotlinOptions { jvmTarget = '1.8' }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources {
            excludes += ['META-INF/*', 'kotlin/**', 'DebugProbesKt.bin', 'META-INF/versions/**']
        }
    }
}

dependencies {
    // 原厂 APK 使用 25.4.0 的 support 库，保持同版本以免资源 id 与行为变化。
    implementation 'com.android.support:design:25.4.0'
    implementation 'com.android.support:appcompat-v7:25.4.0'
    implementation 'com.android.support:recyclerview-v7:25.4.0'
    implementation 'com.android.support:transition:25.4.0'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:support-compat:25.4.0'
    implementation 'com.android.support:support-core-ui:25.4.0'
    implementation 'com.android.support:support-core-utils:25.4.0'
    implementation 'com.android.support:support-fragment:25.4.0'
    implementation 'com.android.support:support-media-compat:25.4.0'
    implementation 'com.android.support:support-vector-drawable:25.4.0'
    implementation 'com.android.support:animated-vector-drawable:25.4.0'
    implementation 'com.android.support:exifinterface:25.4.0'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'

    // Android Architecture Components（Kotlin 层使用 android.arch.* 生命周期 API）
    implementation 'android.arch.lifecycle:runtime:1.1.1'
    implementation 'android.arch.lifecycle:common:1.1.1'
    implementation 'android.arch.lifecycle:viewmodel:1.1.1'
    implementation 'android.arch.lifecycle:livedata-core:1.1.1'
    implementation 'android.arch.core:common:1.1.1'
    implementation 'android.arch.core:runtime:1.1.1'

    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'com.github.bumptech.glide:annotations:4.9.0'
    implementation 'com.github.bumptech.glide:gifdecoder:4.9.0'
    implementation 'com.github.bumptech.glide:disklrucache:4.9.0'
    implementation 'jp.wasabeef:glide-transformations:3.0.1'

    implementation 'com.airbnb.android:lottie:2.7.0'

    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-protobuf:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.9.0'
    implementation 'com.squareup.wire:wire-runtime:2.2.0'
    implementation 'com.qiniu:qiniu-android-sdk:8.5.2'

    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'com.jakewharton.rxbinding:rxbinding:1.0.1'

    implementation 'com.j256.ormlite:ormlite-core:5.1'
    implementation 'com.j256.ormlite:ormlite-android:5.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.alibaba:fastjson:1.2.62'
    implementation 'com.google.protobuf:protobuf-java:3.11.4'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'org.apache.commons:commons-lang3:3.9'

    // 二维码（原厂 APK 内含 com.google.zxing）
    implementation 'com.google.zxing:core:3.3.3'

    implementation 'com.badlogicgames.gdx:gdx:1.9.10'
    implementation 'com.esotericsoftware.spine:spine-libgdx:3.8.55.1'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'

    // 以下库未发布到公共仓库或版本已停更，保留本地 prebuilt jar。
    implementation fileTree(dir: '../prebuilt-local', include: ['*.jar'])
}
